<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PAFL Team Locations</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700;800&family=Barlow+Condensed:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; background: #0d1117; overflow: hidden; }

  .wrap {
    width: 100%; height: 100%;
    display: flex; flex-direction: column;
    font-family: 'Oswald', sans-serif;
  }

  .hdr {
    background: linear-gradient(180deg, #0d1117, #161b22);
    padding: 14px 20px 10px;
    display: flex; justify-content: space-between; align-items: center;
    flex-wrap: wrap; gap: 8px;
    border-bottom: 3px solid #c5a44e;
    flex-shrink: 0;
  }
  .hdr-title { font-weight: 800; font-size: 26px; color: #fff; letter-spacing: 3px; }
  .hdr-sub {
    font-family: 'Barlow Condensed', sans-serif; font-weight: 600;
    font-size: 14px; letter-spacing: 3px; color: rgba(255,255,255,0.45); text-transform: uppercase;
  }
  .leg { display: flex; gap: 14px; }
  .leg-i { display: flex; align-items: center; gap: 6px; }
  .leg-d { width: 12px; height: 12px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.5); }
  .leg-d.l3 { background: #e74c3c; }
  .leg-d.l2 { background: #3498db; }
  .leg-t {
    font-family: 'Barlow Condensed', sans-serif; font-weight: 700;
    font-size: 14px; color: rgba(255,255,255,0.7); letter-spacing: 2px;
  }

  #map { flex: 1; width: 100%; }

  .ftr {
    background: #0d1117; padding: 8px 20px; text-align: center;
    border-top: 1px solid rgba(197,164,78,0.3); flex-shrink: 0;
  }
  .ftr-t {
    font-family: 'Barlow Condensed', sans-serif; font-weight: 500;
    font-size: 13px; letter-spacing: 3px; color: rgba(255,255,255,0.35); text-transform: uppercase;
  }

  .hub { display: flex; flex-direction: column; align-items: center; cursor: pointer; }
  .hub-dot {
    width: 24px; height: 24px; border-radius: 50%;
    background: radial-gradient(circle, #c5a44e 0%, #a08030 100%);
    border: 3px solid #fff;
    box-shadow: 0 0 14px rgba(197,164,78,0.7), 0 0 30px rgba(197,164,78,0.3);
    display: flex; align-items: center; justify-content: center;
    transition: transform 0.2s;
  }
  .hub:hover .hub-dot { transform: scale(1.15); box-shadow: 0 0 20px rgba(197,164,78,1), 0 0 40px rgba(197,164,78,0.5); }
  .hub-n { font-family: 'Oswald', sans-serif; font-weight: 800; font-size: 12px; color: #000; line-height: 1; }
  .hub-city {
    font-family: 'Oswald', sans-serif; font-weight: 700;
    font-size: 13px; color: #fff; letter-spacing: 1.5px; text-transform: uppercase;
    margin-top: 4px; white-space: nowrap;
    text-shadow: 0 1px 6px rgba(0,0,0,1), 0 0 10px rgba(0,0,0,0.8);
  }

  .panel {
    background: rgba(13,17,23,0.97);
    border: 1px solid rgba(197,164,78,0.5);
    border-radius: 8px; padding: 14px 18px; min-width: 240px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.8);
  }
  .panel-city {
    font-weight: 800; font-size: 16px; color: #c5a44e;
    letter-spacing: 2px; text-transform: uppercase;
    border-bottom: 1px solid rgba(197,164,78,0.3);
    padding-bottom: 8px; margin-bottom: 8px; text-align: center;
  }
  .panel-row { display: flex; align-items: center; gap: 8px; padding: 5px 0; }
  .panel-dot { width: 10px; height: 10px; border-radius: 50%; border: 2px solid #fff; flex-shrink: 0; }
  .panel-dot.pd3 { background: #e74c3c; }
  .panel-dot.pd2 { background: #3498db; }
  .panel-link {
    font-family: 'Oswald', sans-serif;
    font-weight: 700; font-size: 14px; letter-spacing: 0.5px; text-transform: uppercase;
    text-decoration: none;
    transition: opacity 0.15s;
  }
  .panel-link:hover { opacity: 0.75; text-decoration: underline; }
  .panel-link.pn3 { color: #ff8a8a; }
  .panel-link.pn2 { color: #74b9ff; }
  .panel-fb {
    font-family: 'Barlow Condensed', sans-serif; font-weight: 600;
    font-size: 10px; color: rgba(255,255,255,0.25); letter-spacing: 1px;
    margin-left: 4px; text-transform: uppercase;
  }
  .panel-dv {
    font-family: 'Barlow Condensed', sans-serif; font-weight: 700;
    font-size: 11px; letter-spacing: 1px; margin-left: auto;
  }
  .panel-dv.pv3 { color: #e74c3c; }
  .panel-dv.pv2 { color: #3498db; }

  .leaflet-popup-content-wrapper { background: transparent !important; border: none !important; box-shadow: none !important; padding: 0 !important; }
  .leaflet-popup-content { margin: 0 !important; }
  .leaflet-popup-tip-container { display: none !important; }
  .leaflet-control-attribution { display: none !important; }
</style>
</head>
<body>
<div class="wrap">
  <div class="hdr">
    <div>
      <div class="hdr-title">PAFL TEAM LOCATIONS</div>
      <div class="hdr-sub">2026 Season · 17 Teams · Click a city to see teams</div>
    </div>
    <div class="leg">
      <div class="leg-i"><div class="leg-d l3"></div><div class="leg-t">3A</div></div>
      <div class="leg-i"><div class="leg-d l2"></div><div class="leg-t">2A</div></div>
    </div>
  </div>
  <div id="map"></div>
  <div class="ftr">
    <div class="ftr-t">Ohio · Pennsylvania · Michigan · West Virginia</div>
  </div>
</div>

<script>
var regions = [
  { city: "Detroit", state: "MI", lat: 42.3314, lng: -83.0458, teams: [
    { name: "Detroit Raiders", div: "3A", fb: "https://www.facebook.com/profile.php?id=61587146039084" },
    { name: "Michigan Hurricanes", div: "3A", fb: "https://www.facebook.com/profile.php?id=61553206092098" }
  ]},
  { city: "Cleveland", state: "OH", lat: 41.4993, lng: -81.6944, teams: [
    { name: "Cleveland Broncos", div: "3A", fb: "https://www.facebook.com/profile.php?id=61561442911212" },
    { name: "Cleveland Cobras", div: "2A", fb: "https://www.facebook.com/clevelandcobrasfootball" }
  ]},
  { city: "Pittsburgh Area", state: "PA", lat: 40.52, lng: -80.05, teams: [
    { name: "Steel City Bobcats", div: "3A", fb: "https://www.facebook.com/SCBFOOTBALL21" },
    { name: "BC Arctic Bengals", div: "3A", fb: "https://www.facebook.com/Beavercountyarcticbengals" },
    { name: "Butler County Bears", div: "2A", fb: "https://www.facebook.com/profile.php?id=100065237751208" },
    { name: "PA Dawgz", div: "2A", fb: "https://www.facebook.com/profile.php?id=61581244787360" },
    { name: "Tri County Rams", div: "2A", fb: "https://www.facebook.com/profile.php?id=61565158637455" }
  ]},
  { city: "Columbus", state: "OH", lat: 39.9612, lng: -82.9988, teams: [
    { name: "Columbus Fire", div: "3A", fb: "https://www.facebook.com/columbusfirefootball" },
    { name: "Mid Ohio Patriots", div: "2A", fb: "https://www.facebook.com/MidOhioPatriotsFootball" }
  ]},
  { city: "Akron / Canton", state: "OH", lat: 41.00, lng: -81.44, teams: [
    { name: "Cuyahoga Falls Rapids", div: "2A", fb: "https://www.facebook.com/profile.php?id=61564834079203" },
    { name: "Stark County Wolfpack", div: "2A", fb: "https://www.facebook.com/starkcounty.wolfpack" }
  ]},
  { city: "Erie", state: "PA", lat: 42.1292, lng: -80.0851, teams: [
    { name: "Erie Express", div: "3A", fb: "https://www.facebook.com/ErieExpressFootball" }
  ]},
  { city: "Cincinnati", state: "OH", lat: 39.1031, lng: -84.5120, teams: [
    { name: "Cincinnati Hawks", div: "3A", fb: "https://www.facebook.com/cincinnati.hawks" }
  ]},
  { city: "Warren", state: "OH", lat: 41.2378, lng: -80.8184, teams: [
    { name: "Warren Pirates", div: "2A", fb: "https://www.facebook.com/profile.php?id=61579945551821" }
  ]},
  { city: "Buckhannon", state: "WV", lat: 38.9940, lng: -80.2320, teams: [
    { name: "WV Leviathan", div: "2A", fb: "https://www.facebook.com/WVLEVIATHANFOOTBALL" }
  ]}
];

function buildPopup(r) {
  var h = '<div class="panel"><div class="panel-city">' + r.city + ', ' + r.state + '</div>';
  r.teams.forEach(function(t) {
    var is3 = t.div === "3A";
    h += '<div class="panel-row">';
    h += '<div class="panel-dot ' + (is3 ? 'pd3' : 'pd2') + '"></div>';
    h += '<a class="panel-link ' + (is3 ? 'pn3' : 'pn2') + '" href="' + t.fb + '" target="_blank" rel="noopener">' + t.name + '</a>';
    h += '<span class="panel-fb">FB</span>';
    h += '<div class="panel-dv ' + (is3 ? 'pv3' : 'pv2') + '">' + t.div + '</div>';
    h += '</div>';
  });
  h += '</div>';
  return h;
}

var map = L.map('map', {
  center: [40.55, -81.5],
  zoom: 7,
  zoomControl: false,
  scrollWheelZoom: false,
  dragging: false,
  touchZoom: false,
  doubleClickZoom: false,
  boxZoom: false,
  keyboard: false
});

L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
  maxZoom: 19
}).addTo(map);

var bounds = L.latLngBounds(regions.map(function(r) { return [r.lat, r.lng]; }));
map.fitBounds(bounds.pad(0.15));

regions.forEach(function(r) {
  var icon = L.divIcon({
    className: 'hub',
    html: '<div class="hub-dot"><span class="hub-n">' + r.teams.length + '</span></div><div class="hub-city">' + r.city + '</div>',
    iconSize: [24, 48],
    iconAnchor: [12, 12],
    popupAnchor: [0, -20]
  });
  L.marker([r.lat, r.lng], { icon: icon }).addTo(map)
    .bindPopup(buildPopup(r), { maxWidth: 300 });
});
</script>
</body>
</html>
